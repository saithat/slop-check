name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 build --locked --release
      - run: cargo +1.85.0 package --locked
      - run: python3 scripts/benchmark.py --files 100 --runs 1 --output bench-results/ci.json
